<svg width="320" height="190" viewBox="0 0 320 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lightBg6" x1="0" y1="0" x2="320" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dce6dd"/>
      <stop offset="35%" stop-color="#edf2ec"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
  </defs>

  <rect width="320" height="190" fill="url(#lightBg6)"/>

  <!-- Top Header Badge -->
  <rect x="55" y="10" width="210" height="18" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.15)" stroke-width="1"/>
  <text x="160" y="22.5" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="1.2">
    WATERMARKED TRANSCRIPT ENGINE
  </text>

  <!-- Left: Official Certificate Sheet -->
  <g transform="translate(20, 38)">
    <rect width="175" height="102" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Watermark text in background -->
    <g opacity="0.08" transform="rotate(-15 87 51)">
      <text x="87" y="46" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">OFFICIAL</text>
      <text x="87" y="62" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">CAMPUSSYNC ERP</text>
    </g>

    <!-- Certificate Header -->
    <rect x="8" y="8" width="159" height="20" fill="#1e293b"/>
    <text x="14" y="21" fill="#ffffff" font-family="'Times New Roman', Times, Georgia, serif" font-size="8.5" font-weight="700">CAMPUSSYNC UNIVERSITY</text>
    <text x="135" y="21" fill="#cbd5e1" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-style="italic">#NX-8921</text>

    <!-- Student and SGPA Record -->
    <text x="10" y="40" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-weight="700">Student: Rikik Gautam • B.Tech CSE</text>
    <text x="10" y="52" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-weight="700">Cumulative GPA: 9.42 / 10.00 (Honors)</text>

    <!-- Snippet Course Rows -->
    <line x1="8" y1="58" x2="167" y2="58" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="10" y="68" fill="#475569" font-family="'Times New Roman', Times, Georgia, serif" font-size="6.5">CS401 Distributed Systems: Grade S (10.0)</text>
    <text x="10" y="78" fill="#475569" font-family="'Times New Roman', Times, Georgia, serif" font-size="6.5">CS402 Database Engineering: Grade S (10.0)</text>

    <!-- Signature Stamp -->
    <path d="M 12 92 Q 25 86 38 93 T 65 90" stroke="#0f172a" stroke-width="1.2" fill="none"/>
    <text x="12" y="99" fill="#64748b" font-family="'Times New Roman', Times, Georgia, serif" font-size="5.5" font-style="italic">Registrar of Examination</text>

    <!-- Institutional Gold Seal -->
    <circle cx="150" cy="88" r="9" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
    <circle cx="150" cy="88" r="7" fill="none" stroke="#b45309" stroke-width="0.7" stroke-dasharray="2 1"/>
    <text x="150" y="90.5" fill="#b45309" font-family="'Times New Roman', Times, Georgia, serif" font-size="4.5" font-weight="700" text-anchor="middle">SEAL</text>
  </g>

  <!-- Right: Cryptographic QR Code -->
  <g transform="translate(205, 38)">
    <rect width="95" height="102" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <text x="47" y="16" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-weight="700" text-anchor="middle">QR VERIFIER</text>

    <!-- QR Code Graphic -->
    <g transform="translate(20, 24)">
      <rect x="0" y="0" width="55" height="55" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      
      <!-- Anchors -->
