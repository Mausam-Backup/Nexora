      <rect x="6" y="6" width="10" height="10" fill="#ffffff"/>
      <rect x="8" y="8" width="6" height="6" fill="#1e293b"/>

      <rect x="37" y="4" width="14" height="14" fill="#1e293b"/>
      <rect x="39" y="6" width="10" height="10" fill="#ffffff"/>
      <rect x="41" y="8" width="6" height="6" fill="#1e293b"/>

      <rect x="4" y="37" width="14" height="14" fill="#1e293b"/>
      <rect x="6" y="39" width="10" height="10" fill="#ffffff"/>
      <rect x="8" y="41" width="6" height="6" fill="#1e293b"/>

      <!-- Data Dots -->
      <rect x="22" y="6" width="4" height="4" fill="#1e293b"/>
      <rect x="29" y="8" width="4" height="4" fill="#1e293b"/>
      <rect x="22" y="14" width="5" height="4" fill="#1e293b"/>
      <rect x="22" y="22" width="11" height="11" fill="#1e293b"/>
      <rect x="25" y="25" width="5" height="5" fill="#ffffff"/>
      <rect x="38" y="22" width="4" height="4" fill="#1e293b"/>
      <rect x="44" y="24" width="4" height="4" fill="#1e293b"/>
      <rect x="22" y="38" width="4" height="4" fill="#1e293b"/>
      <rect x="30" y="40" width="4" height="4" fill="#1e293b"/>
      <rect x="38" y="38" width="4" height="4" fill="#1e293b"/>
      <rect x="44" y="42" width="4" height="4" fill="#1e293b"/>
    </g>

    <!-- SHA-256 Token -->
    <rect x="8" y="84" width="79" height="13" rx="2" fill="#ecfdf5" stroke="#047857" stroke-width="0.8"/>
    <text x="47" y="93" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="6.5" font-weight="700" text-anchor="middle">SHA-256 Validated ✓</text>
  </g>

  <!-- Bottom Academic Citation -->
  <rect x="55" y="160" width="210" height="18" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.15)" stroke-width="1"/>
  <text x="160" y="172" fill="#334155" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-style="italic" text-anchor="middle">
