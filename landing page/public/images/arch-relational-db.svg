<svg width="320" height="190" viewBox="0 0 320 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lightBg2" x1="0" y1="0" x2="320" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dce6dd"/>
      <stop offset="35%" stop-color="#edf2ec"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
  </defs>

  <rect width="320" height="190" fill="url(#lightBg2)"/>

  <!-- Top Institutional Header -->
  <rect x="60" y="10" width="200" height="18" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.15)" stroke-width="1"/>
  <text x="160" y="22.5" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="1.2">
    POSTGRESQL RELATIONAL SCHEMA
  </text>

  <!-- Table 1: students (Left) -->
  <g transform="translate(18, 38)">
    <rect width="90" height="102" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <!-- Header -->
    <rect x="0" y="0" width="90" height="20" fill="#1e293b"/>
    <text x="8" y="14" fill="#ffffff" font-family="'Times New Roman', Times, Georgia, serif" font-size="8.5" font-weight="700">students</text>
    
    <!-- Field rows -->
    <text x="8" y="34" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-weight="700">PK id (UUID)</text>
    <line x1="6" y1="38" x2="84" y2="38" stroke="#e2e8f0" stroke-width="0.8"/>
    
    <text x="8" y="48" fill="#475569" font-family="'Times New Roman', Times, Georgia, serif" font-size="7">reg_no: text</text>
    <line x1="6" y1="52" x2="84" y2="52" stroke="#e2e8f0" stroke-width="0.8"/>
    
    <text x="8" y="62" fill="#475569" font-family="'Times New Roman', Times, Georgia, serif" font-size="7">full_name: text</text>
    <line x1="6" y1="66" x2="84" y2="66" stroke="#e2e8f0" stroke-width="0.8"/>
    
    <text x="8" y="76" fill="#475569" font-family="'Times New Roman', Times, Georgia, serif" font-size="7">semester: integer</text>
    <line x1="6" y1="80" x2="84" y2="80" stroke="#e2e8f0" stroke-width="0.8"/>

    <text x="8" y="93" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="7" font-weight="700">status: active</text>
  </g>

  <!-- Center Cylinder Icon & File Meta -->
  <g transform="translate(142, 58)">
    <ellipse cx="18" cy="8" rx="16" ry="5" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <path d="M2,8 C2,13 34,13 34,8 L34,22 C34,27 2,27 2,22 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <path d="M2,22 C2,27 34,27 34,22 L34,36 C34,41 2,41 2,36 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <path d="M2,36 C2,41 34,41 34,36 L34,50 C34,55 2,55 2,50 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>

    <text x="18" y="68" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8" font-weight="700" text-anchor="middle">
      db.sql
    </text>
  </g>

  <!-- Table 2: exam_clearance (Right) -->
  <g transform="translate(212, 38)">
    <rect width="90" height="102" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <!-- Header -->
    <rect x="0" y="0" width="90" height="20" fill="#1e293b"/>
    <text x="8" y="14" fill="#ffffff" font-family="'Times New Roman', Times, Georgia, serif" font-size="8.5" font-weight="700">clearance_matrix</text>
    
    <!-- Field rows -->
    <text x="8" y="34" fill="#b45309" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-weight="700">FK student_id</text>
    <line x1="6" y1="38" x2="84" y2="38" stroke="#e2e8f0" stroke-width="0.8"/>
    
    <text x="8" y="48" fill="#475569" font-family="'Times New Roman', Times, Georgia, serif" font-size="7">attendance: 81.2%</text>
    <line x1="6" y1="52" x2="84" y2="52" stroke="#e2e8f0" stroke-width="0.8"/>
    
    <text x="8" y="62" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="7">aicte_gate: true</text>
    <line x1="6" y1="66" x2="84" y2="66" stroke="#e2e8f0" stroke-width="0.8"/>
    
    <text x="8" y="76" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="7">dues_clear: true</text>
    <line x1="6" y1="80" x2="84" y2="80" stroke="#e2e8f0" stroke-width="0.8"/>

    <text x="8" y="93" fill="#1e293b" font-family="'Times New Roman', Times, Georgia, serif" font-size="7" font-weight="700">hall_ticket: unlocked</text>
  </g>

  <!-- Connective Relation Wire -->
  <path d="M108,72 C126,72 128,88 142,88" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M178,88 C192,88 194,72 212,72" stroke="#1e293b" stroke-width="1.2"/>
  <circle cx="108" cy="72" r="2.5" fill="#1e293b"/>
  <polygon points="212,72 206,69 206,75" fill="#1e293b"/>

  <!-- Bottom Citation Bar -->
  <rect x="58" y="160" width="204" height="18" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.15)" stroke-width="1"/>
  <text x="160" y="172" fill="#334155" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-style="italic" text-anchor="middle">
    1,287-Line ACID Compliant Relational Schema
  </text>
</svg>
