    <text x="8" y="48" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5">• Multi-Tab Bus: 0.0 ms</text>
    <line x1="6" y1="52" x2="114" y2="52" stroke="#e2e8f0" stroke-width="0.8"/>

    <text x="8" y="64" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5">• PostgreSQL Pool: Healthy</text>
