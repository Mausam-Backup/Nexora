<svg width="320" height="190" viewBox="0 0 320 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lightBg7" x1="0" y1="0" x2="320" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dce6dd"/>
      <stop offset="35%" stop-color="#edf2ec"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
  </defs>

  <rect width="320" height="190" fill="url(#lightBg7)"/>

  <!-- Top Header Badge -->
  <rect x="55" y="10" width="210" height="18" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.15)" stroke-width="1"/>
  <text x="160" y="22.5" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="1.2">
    HYBRID DOMAIN ERP AI (ASK AI)
  </text>

  <!-- Left: Deterministic Rules Engine (0ms) -->
  <g transform="translate(18, 40)">
    <rect width="115" height="96" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <!-- Titlebar -->
    <rect x="0" y="0" width="115" height="18" fill="#1e293b"/>
    <text x="57" y="12.5" fill="#ffffff" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-weight="700" text-anchor="middle">0ms Offline Rules</text>

    <!-- Rule evaluations -->
    <text x="8" y="32" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5">Rule 1: Attendance &gt; 75%</text>
    <line x1="6" y1="36" x2="109" y2="36" stroke="#e2e8f0" stroke-width="0.8"/>

    <text x="8" y="48" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5">Rule 2: Balance == $0</text>
    <line x1="6" y1="52" x2="109" y2="52" stroke="#e2e8f0" stroke-width="0.8"/>

    <text x="8" y="64" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5">Rule 3: Prereq Completed</text>
    <line x1="6" y1="68" x2="109" y2="68" stroke="#e2e8f0" stroke-width="0.8"/>

    <!-- Verification status -->
    <rect x="10" y="74" width="95" height="15" rx="2" fill="#ecfdf5" stroke="#047857" stroke-width="0.8"/>
    <text x="57" y="85" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="6.5" font-weight="700" text-anchor="middle">Deterministic Truth ✓</text>
  </g>

  <!-- Central Symbol -->
  <g transform="translate(142, 70)">
    <circle cx="18" cy="18" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <text x="18" y="22" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="12" font-weight="700" text-anchor="middle">✦</text>
  </g>

  <!-- Right: Gemini 1.5 Flash Copilot -->
  <g transform="translate(187, 40)">
    <rect width="115" height="96" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <!-- Titlebar -->
    <rect x="0" y="0" width="115" height="18" fill="#1e293b"/>
    <text x="57" y="12.5" fill="#ffffff" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-weight="700" text-anchor="middle">Gemini 1.5 Flash</text>

    <!-- Chat dialogue -->
    <text x="8" y="32" fill="#475569" font-family="'Times New Roman', Times, Georgia, serif" font-size="6.5" font-style="italic">"Can I register CS402?"</text>
    <line x1="6" y1="36" x2="109" y2="36" stroke="#e2e8f0" stroke-width="0.8"/>

    <text x="8" y="48" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="7" font-weight="700">"Eligible. Dues settled.</text>
    <text x="8" y="58" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="7">CS401 cleared with Grade S.</text>
    <text x="8" y="68" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="7">Slot 4B open."</text>

