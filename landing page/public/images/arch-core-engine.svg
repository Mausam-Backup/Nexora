<svg width="320" height="190" viewBox="0 0 320 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lightBg1" x1="0" y1="0" x2="320" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dce6dd"/>
      <stop offset="35%" stop-color="#edf2ec"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
    <radialGradient id="softGlow1" cx="35%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bbf7d0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#edf2ec" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Light Grayish-White Canvas -->
  <rect width="320" height="190" fill="url(#lightBg1)"/>
  <circle cx="110" cy="95" r="90" fill="url(#softGlow1)"/>

  <!-- Delicate Technical Linework & Crosshairs -->
  <g stroke="rgba(15,23,42,0.08)" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="190"/>
    <line x1="0" y1="95" x2="320" y2="95"/>
    <circle cx="160" cy="95" r="70" fill="none"/>
    <circle cx="160" cy="95" r="52" fill="none" stroke-dasharray="3 3"/>
  </g>

  <!-- Top Institutional Badge -->
  <rect x="55" y="10" width="210" height="18" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.15)" stroke-width="1"/>
  <text x="160" y="22.5" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="1.2">
    NEXORA RELATIONAL LEDGER CORE
  </text>

  <!-- Central Nexus Emblem -->
  <g transform="translate(160, 95)">
    <!-- Outer Octagon Badge -->
    <polygon points="0,-36 32,-16 32,16 0,36 -32,16 -32,-16" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    <polygon points="0,-30 26,-13 26,13 0,30 -26,13 -26,-13" fill="#f8fafc" stroke="rgba(15,23,42,0.2)" stroke-width="0.8"/>

    <!-- Classic Serif Roman N -->
    <text x="0" y="12" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="34" font-weight="700" text-anchor="middle">
      N
    </text>
  </g>

  <!-- Satellite Nodes (Academics, CoE, Finance, Hostel) -->
  <!-- Academics (Top Left) -->
  <g transform="translate(22, 38)">
    <rect width="84" height="24" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.16)" stroke-width="1"/>
    <circle cx="9" cy="12" r="3" fill="#0f172a"/>
    <text x="47" y="15.5" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8" font-weight="700" text-anchor="middle">
      Academics
    </text>
  </g>
  <line x1="106" y1="50" x2="132" y2="78" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Examination CoE (Top Right) -->
  <g transform="translate(214, 38)">
    <rect width="84" height="24" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.16)" stroke-width="1"/>
    <circle cx="75" cy="12" r="3" fill="#0f172a"/>
    <text x="38" y="15.5" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8" font-weight="700" text-anchor="middle">
      Exam CoE
    </text>
  </g>
  <line x1="214" y1="50" x2="188" y2="78" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Finance Treasury (Bottom Left) -->
  <g transform="translate(22, 128)">
    <rect width="84" height="24" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.16)" stroke-width="1"/>
    <circle cx="9" cy="12" r="3" fill="#0f172a"/>
    <text x="47" y="15.5" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8" font-weight="700" text-anchor="middle">
      Finance Treasury
    </text>
  </g>
  <line x1="106" y1="140" x2="132" y2="112" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Hostel Ops (Bottom Right) -->
  <g transform="translate(214, 128)">
    <rect width="84" height="24" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.16)" stroke-width="1"/>
    <circle cx="75" cy="12" r="3" fill="#0f172a"/>
    <text x="38" y="15.5" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8" font-weight="700" text-anchor="middle">
      Hostel Office
    </text>
  </g>
  <line x1="214" y1="140" x2="188" y2="112" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Bottom Academic Citation / Status -->
  <rect x="68" y="162" width="184" height="18" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.15)" stroke-width="1"/>
  <text x="160" y="174" fill="#334155" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-style="italic" text-anchor="middle">
    Deterministic Single Source of Collegiate Truth
  </text>
</svg>
