<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p2LightBg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dce6dd"/>
      <stop offset="35%" stop-color="#edf2ec"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#p2LightBg)"/>

  <!-- Top Title Badge -->
  <rect x="40" y="20" width="220" height="22" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.15)"/>
  <text x="150" y="35" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">
    LATENCY BENCHMARKS (ms)
  </text>

  <!-- Grid Lines -->
  <g stroke="rgba(15,23,42,0.08)" stroke-width="1">
    <line x1="40" y1="60" x2="360" y2="60"/>
    <line x1="40" y1="110" x2="360" y2="110"/>
    <line x1="40" y1="160" x2="360" y2="160"/>
    <line x1="40" y1="210" x2="360" y2="210"/>
  </g>

  <!-- Bar 1: Nexora Bus -->
  <text x="40" y="92" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="11" font-weight="700">Nexora Bus</text>
  <rect x="140" y="80" width="8" height="18" rx="2" fill="#047857"/>
  <text x="155" y="93" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="10" font-weight="700">0.2 ms [Real-Time]</text>

  <!-- Bar 2: WebSockets -->
  <text x="40" y="142" fill="#334155" font-family="'Times New Roman', Times, Georgia, serif" font-size="11">WebSockets</text>
  <rect x="140" y="130" width="70" height="18" rx="2" fill="#1e293b"/>
  <text x="218" y="143" fill="#334155" font-family="'Times New Roman', Times, Georgia, serif" font-size="10">45.0 ms</text>

  <!-- Bar 3: SSE -->
  <text x="40" y="192" fill="#334155" font-family="'Times New Roman', Times, Georgia, serif" font-size="11">SSE Stream</text>
  <rect x="140" y="180" width="130" height="18" rx="2" fill="#475569"/>
  <text x="278" y="193" fill="#334155" font-family="'Times New Roman', Times, Georgia, serif" font-size="10">120.0 ms</text>

  <!-- Bar 4: REST Poll -->
  <text x="40" y="242" fill="#334155" font-family="'Times New Roman', Times, Georgia, serif" font-size="11">REST Poll</text>
  <rect x="140" y="230" width="190" height="18" rx="2" fill="#b91c1c"/>
  <text x="338" y="243" fill="#b91c1c" font-family="'Times New Roman', Times, Georgia, serif" font-size="10">2,000 ms</text>

  <!-- Footer Tag -->
  <rect x="40" y="264" width="320" height="22" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.15)"/>
  <text x="200" y="278" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="9" font-weight="700" text-anchor="middle">
    99.99% Faster Concurrency than Polling Architecture
  </text>
</svg>
