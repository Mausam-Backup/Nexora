# ============================================================
# Nexora ERP — docker-compose.yml
# Full stack orchestration: App + MongoDB + Redis
# ============================================================
#
# Usage:
#   docker compose up --build          # Build and start all services
#   docker compose up -d               # Start in detached (background) mode
#   docker compose down                # Stop and remove containers
#   docker compose logs -f app         # Follow app logs
#
# ============================================================

version: "3.9"

services:

  # ─── Main Application (Express API + React SPA) ───────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: nexora_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      # MongoDB connection — points to the 'mongo' service below
      MONGODB_URI: mongodb://mongo:27017/nexora_erp
      # Redis connection — points to the 'redis' service below
      REDIS_URL: redis://redis:6379
      # JWT Secret (override in production with a strong secret)
      JWT_SECRET: ${JWT_SECRET:-nexora_erp_jwt_secret_change_in_production}
      # Supabase (optional — override via .env)
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    volumes:
      # Persist the ERP JSON state file across container restarts
      - ./backend/data:/app/backend/data:rw
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexora_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── MongoDB Database ──────────────────────────────────────
  mongo:
    image: mongo:7.0-jammy
    container_name: nexora_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: nexora_erp
    ports:
      - "27017:27017"
    volumes:
      # Persist MongoDB data across container restarts
      - nexora_mongo_data:/data/db
      # Seed script runs once on first init
      - ./db.sql:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - nexora_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Redis Cache (Session + Notification Cache) ────────────
  redis:
    image: redis:7.2-alpine
    container_name: nexora_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - nexora_redis_data:/data
    networks:
      - nexora_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ─── Nginx Reverse Proxy (Production Gateway) ─────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: nexora_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - nexora_network
    profiles:
      # Only starts when --profile production is passed:
      #   docker compose --profile production up
      - production

# ─── Named Volumes ─────────────────────────────────────────
volumes:
  nexora_mongo_data:
    driver: local
    name: nexora_mongo_data
  nexora_redis_data:
    driver: local
    name: nexora_redis_data

# ─── Network ───────────────────────────────────────────────
networks:
  nexora_network:
    driver: bridge
    name: nexora_network
