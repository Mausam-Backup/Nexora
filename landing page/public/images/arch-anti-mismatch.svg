<svg width="320" height="190" viewBox="0 0 320 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lightBg5" x1="0" y1="0" x2="320" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dce6dd"/>
      <stop offset="35%" stop-color="#edf2ec"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
  </defs>

  <rect width="320" height="190" fill="url(#lightBg5)"/>

  <!-- Top Header Badge -->
  <rect x="55" y="10" width="210" height="18" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.15)" stroke-width="1"/>
  <text x="160" y="22.5" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="1.2">
    ANTI-MISMATCH RECONCILIATION
  </text>

  <!-- Left: Legacy Conflicting Department Spreadsheets -->
  <g transform="translate(18, 40)">
    <rect width="105" height="96" rx="4" fill="#ffffff" stroke="#b91c1c" stroke-width="1"/>
    <!-- Titlebar -->
    <rect x="0" y="0" width="105" height="18" fill="#b91c1c"/>
    <text x="52" y="12.5" fill="#ffffff" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-weight="700" text-anchor="middle">Legacy Sheets (.csv)</text>

    <!-- Rows with conflict tags -->
    <text x="8" y="32" fill="#7f1d1d" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5">• Accounts: $450 Due</text>
    <line x1="6" y1="36" x2="99" y2="36" stroke="#fecaca" stroke-width="0.8"/>

    <text x="8" y="48" fill="#7f1d1d" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5">• Faculty: 72% [Debar]</text>
    <line x1="6" y1="52" x2="99" y2="52" stroke="#fecaca" stroke-width="0.8"/>

    <text x="8" y="64" fill="#7f1d1d" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5">• CoE: Discrepancy</text>
    <line x1="6" y1="68" x2="99" y2="68" stroke="#fecaca" stroke-width="0.8"/>

    <!-- Warning Pill -->
    <rect x="12" y="74" width="81" height="15" rx="2" fill="#fef2f2" stroke="#b91c1c" stroke-width="0.8"/>
    <text x="52" y="85" fill="#b91c1c" font-family="'Times New Roman', Times, Georgia, serif" font-size="6.5" font-weight="700" text-anchor="middle">State Conflicts Detected</text>
  </g>

  <!-- Central Ingestion & Reconcile Engine -->
  <g transform="translate(133, 68)">
    <polygon points="4,4 50,4 37,32 17,32" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <rect x="17" y="32" width="20" height="14" fill="#1e293b"/>
    <text x="27" y="18" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8" font-weight="700" text-anchor="middle">HASH</text>
    <text x="27" y="42" fill="#ffffff" font-family="'Times New Roman', Times, Georgia, serif" font-size="6.5" font-weight="700" text-anchor="middle">✓</text>
  </g>

  <!-- Right: Unified Ledger -->
  <g transform="translate(197, 40)">
    <rect width="105" height="96" rx="4" fill="#ffffff" stroke="#047857" stroke-width="1"/>
    <!-- Titlebar -->
    <rect x="0" y="0" width="105" height="18" fill="#047857"/>
    <text x="52" y="12.5" fill="#ffffff" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-weight="700" text-anchor="middle">Unified Ledger Row</text>

    <!-- Rows resolved -->
    <text x="8" y="32" fill="#065f46" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5">✓ Accounts: Settle $0</text>
    <line x1="6" y1="36" x2="99" y2="36" stroke="#a7f3d0" stroke-width="0.8"/>

    <text x="8" y="48" fill="#065f46" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5">✓ Faculty: 78.4% [Pass]</text>
    <line x1="6" y1="52" x2="99" y2="52" stroke="#a7f3d0" stroke-width="0.8"/>

    <text x="8" y="64" fill="#065f46" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5">✓ CoE: Hall Pass Issued</text>
    <line x1="6" y1="68" x2="99" y2="68" stroke="#a7f3d0" stroke-width="0.8"/>

    <!-- Reconciled Pill -->
    <rect x="12" y="74" width="81" height="15" rx="2" fill="#ecfdf5" stroke="#047857" stroke-width="0.8"/>
    <text x="52" y="85" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="6.5" font-weight="700" text-anchor="middle">Zero Data Mismatch</text>
  </g>

  <!-- Bottom Academic Citation -->
  <rect x="55" y="160" width="210" height="18" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.15)" stroke-width="1"/>
  <text x="160" y="172" fill="#334155" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-style="italic" text-anchor="middle">
    Automated Multi-Departmental Ingestion &amp; Audit Log
  </text>
</svg>
