<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p3LightBg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dce6dd"/>
      <stop offset="35%" stop-color="#edf2ec"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#p3LightBg)"/>

  <!-- Top Title Badge -->
  <rect x="40" y="20" width="220" height="22" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.15)"/>
  <text x="150" y="35" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">
    AICTE COMPLIANCE GATEWAY
  </text>

  <!-- Stage 1: Biometric Attendance -->
  <g transform="translate(40, 58)">
    <rect width="90" height="74" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <text x="45" y="20" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8.5" font-weight="700" text-anchor="middle">Biometric Logs</text>
    <text x="45" y="44" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="15" font-weight="700" text-anchor="middle">≥ 75%</text>
    <text x="45" y="62" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-weight="700" text-anchor="middle">Gate I: Pass ✓</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="132" y1="95" x2="152" y2="95" stroke="#1e293b" stroke-width="1.5"/>
  <polygon points="154,95 148,91 148,99" fill="#1e293b"/>

  <!-- Stage 2: Fee Clearance -->
  <g transform="translate(155, 58)">
    <rect width="90" height="74" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <text x="45" y="20" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8.5" font-weight="700" text-anchor="middle">Finance Ledger</text>
    <text x="45" y="44" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="14" font-weight="700" text-anchor="middle">$0 Due</text>
    <text x="45" y="62" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-weight="700" text-anchor="middle">Gate II: Pass ✓</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="247" y1="95" x2="267" y2="95" stroke="#1e293b" stroke-width="1.5"/>
  <polygon points="269,95 263,91 263,99" fill="#1e293b"/>

  <!-- Stage 3: Hall Ticket Generated -->
  <g transform="translate(270, 58)">
    <rect width="90" height="74" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <text x="45" y="20" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8.5" font-weight="700" text-anchor="middle">Admit Card</text>
    <text x="45" y="44" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="12" font-weight="700" text-anchor="middle">UNLOCKED</text>
    <text x="45" y="62" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-weight="700" text-anchor="middle">QR Issued ✓</text>
  </g>

  <!-- Bottom Console Output -->
  <g transform="translate(40, 146)">
    <rect width="320" height="124" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="320" height="20" fill="#1e293b"/>
    <text x="12" y="14" fill="#ffffff" font-family="'Times New Roman', Times, Georgia, serif" font-size="8" font-weight="700">statutory_audit_daemon.log</text>

    <text x="12" y="38" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="8">• Student ID #23BCE1048: Attendance 81.4% (Threshold: 75.0%)</text>
    <text x="12" y="54" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="8">• Finance status: tuition settled, hostel NOC cleared</text>
    <text x="12" y="70" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8">• Hash 4f9a72b0c1e8d4a9 authenticated with CoE Registrar</text>
    <text x="12" y="86" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8">• Hall ticket released with cryptographically verified QR code</text>
    <text x="12" y="102" fill="#334155" font-family="'Times New Roman', Times, Georgia, serif" font-size="8" font-style="italic">• Statutory gate audit: 0 violations detected</text>
  </g>
