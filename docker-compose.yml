# ============================================================
# Nexora ERP — docker-compose.yml
# Full stack orchestration — each service uses its own folder
#
#   frontend/  →  React + Nginx  (port 3000)
#   backend/   →  Express API    (port 5000)
#   mongo      →  MongoDB 7      (port 27017)
#   redis      →  Redis 7        (port 6379)
#
# Usage:
#   docker compose up --build        # Build all and start
#   docker compose up -d             # Detached (background)
#   docker compose down              # Stop and remove
#   docker compose logs -f frontend  # Follow frontend logs
#   docker compose logs -f backend   # Follow backend logs
# ============================================================

version: "3.9"

services:

  # ─── Frontend — React + Nginx ──────────────────────────────
  frontend:
    build:
      context: ./frontend          # Uses frontend/Dockerfile
      dockerfile: Dockerfile
    container_name: nexora_frontend
    restart: unless-stopped
    ports:
      - "3000:80"                  # App available at http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexora_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Backend — Express.js API ──────────────────────────────
  backend:
    build:
      context: ./backend           # Uses backend/Dockerfile
      dockerfile: Dockerfile
    container_name: nexora_backend
    restart: unless-stopped
    ports:
      - "5000:5000"                # API at http://localhost:5000
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      MONGODB_URI: mongodb://mongo:27017/nexora_erp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-nexora_erp_jwt_secret_change_in_production}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    volumes:
      # Persist ERP JSON state across restarts
      - ./backend/data:/app/data:rw
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexora_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── MongoDB Database ──────────────────────────────────────
  mongo:
    image: mongo:7.0-jammy
    container_name: nexora_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: nexora_erp
    ports:
      - "27017:27017"
    volumes:
      - nexora_mongo_data:/data/db
    networks:
      - nexora_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Redis Cache ───────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: nexora_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - nexora_redis_data:/data
    networks:
      - nexora_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

# ─── Named Volumes ─────────────────────────────────────────
volumes:
  nexora_mongo_data:
    driver: local
    name: nexora_mongo_data
  nexora_redis_data:
    driver: local
    name: nexora_redis_data

# ─── Network ───────────────────────────────────────────────
networks:
  nexora_network:
    driver: bridge
    name: nexora_network
