<svg width="320" height="190" viewBox="0 0 320 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lightBg4" x1="0" y1="0" x2="320" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dce6dd"/>
      <stop offset="35%" stop-color="#edf2ec"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
  </defs>

  <rect width="320" height="190" fill="url(#lightBg4)"/>

  <!-- Top Header Badge -->
  <rect x="55" y="10" width="210" height="18" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.15)" stroke-width="1"/>
  <text x="160" y="22.5" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="1.2">
    AICTE STATUTORY EXAM GATEKEEPER
  </text>

  <!-- Left: Attendance Radial Meter Card -->
  <g transform="translate(25, 40)">
    <rect width="120" height="96" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <!-- Title -->
    <text x="60" y="18" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="8" font-weight="700" text-anchor="middle">Biometric Attendance</text>
    
    <!-- Gauge Arc -->
    <path d="M 30 65 A 30 30 0 1 1 90 65" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
    <path d="M 30 65 A 30 30 0 1 1 80 42" fill="none" stroke="#047857" stroke-width="6" stroke-linecap="round"/>
    
    <text x="60" y="58" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="14" font-weight="700" text-anchor="middle">81.2%</text>
    <text x="60" y="70" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="7" font-weight="700" text-anchor="middle">Threshold: ≥ 75.0%</text>

    <!-- Passing Badge -->
    <rect x="22" y="76" width="76" height="14" rx="2" fill="#047857"/>
    <text x="60" y="86" fill="#ffffff" font-family="'Times New Roman', Times, Georgia, serif" font-size="7" font-weight="700" text-anchor="middle">AICTE Permitted ✓</text>
  </g>

  <!-- Right: Digital Hall Ticket & Barcode -->
  <g transform="translate(175, 40)">
    <rect width="120" height="96" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="120" height="18" fill="#1e293b"/>
    <text x="60" y="12.5" fill="#ffffff" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-weight="700" text-anchor="middle">Hall Ticket #NX-2026</text>

    <!-- Checklist -->
    <text x="10" y="32" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-weight="700">✓ Attendance: 81.2%</text>
    <text x="10" y="44" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-weight="700">✓ Dues Settled: $0.00</text>
    <text x="10" y="56" fill="#0f172a" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-weight="700">• CoE Moderation: +3m</text>

    <!-- Classic Clean Barcode -->
    <g transform="translate(15, 66)">
      <rect x="0" y="0" width="90" height="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" rx="2"/>
      <line x1="8" y1="3" x2="8" y2="17" stroke="#000" stroke-width="2"/>
      <line x1="13" y1="3" x2="13" y2="17" stroke="#000" stroke-width="1"/>
      <line x1="17" y1="3" x2="17" y2="17" stroke="#000" stroke-width="3"/>
      <line x1="23" y1="3" x2="23" y2="17" stroke="#000" stroke-width="1"/>
      <line x1="28" y1="3" x2="28" y2="17" stroke="#000" stroke-width="2"/>
      <line x1="33" y1="3" x2="33" y2="17" stroke="#000" stroke-width="1"/>
      <line x1="38" y1="3" x2="38" y2="17" stroke="#000" stroke-width="4"/>
      <line x1="46" y1="3" x2="46" y2="17" stroke="#000" stroke-width="1"/>
      <line x1="51" y1="3" x2="51" y2="17" stroke="#000" stroke-width="2"/>
      <line x1="57" y1="3" x2="57" y2="17" stroke="#000" stroke-width="3"/>
      <line x1="64" y1="3" x2="64" y2="17" stroke="#000" stroke-width="1"/>
      <line x1="69" y1="3" x2="69" y2="17" stroke="#000" stroke-width="2"/>
      <line x1="75" y1="3" x2="75" y2="17" stroke="#000" stroke-width="1"/>
      <line x1="80" y1="3" x2="80" y2="17" stroke="#000" stroke-width="3"/>
    </g>
  </g>

  <!-- Connective Verify Stamp Icon -->
  <circle cx="157" cy="88" r="9" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
  <text x="157" y="91" fill="#047857" font-family="'Times New Roman', Times, Georgia, serif" font-size="8" font-weight="700" text-anchor="middle">✓</text>

  <!-- Bottom Academic Citation -->
  <rect x="55" y="160" width="210" height="18" rx="4" fill="#ffffff" stroke="rgba(15,23,42,0.15)" stroke-width="1"/>
  <text x="160" y="172" fill="#334155" font-family="'Times New Roman', Times, Georgia, serif" font-size="7.5" font-style="italic" text-anchor="middle">
    Statutory 75% Debarment Guard &amp; CoE Exam Moderation
  </text>
</svg>
